methods:
  - previous_hungarian
  - pairwise_affine
  - first_affine
  - dual_anchor

frozen_tracker:
  reference_weight: 6.0
  descriptor_weight: 0.0
  descriptor_quantiles: 32
  affine_iterations: 6
  affine_ridge: 0.2
  affine_huber_delta: 2.5
  affine_min_scale: 0.70
  affine_max_scale: 1.40
  spatial_scale_floor_um: 0.10

evaluation:
  primary: seeded_idf1
  secondary: [identity_switches, severe_identity_accuracy, runtime_seconds]
  uncertainty: paired_complete_recording_bootstrap
