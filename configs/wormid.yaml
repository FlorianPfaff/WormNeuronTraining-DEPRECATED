dataset:
  root: /mnt/d/CodexData/wha_neuron_data/wormid_ey
  tuning_recording: sub-20190925-04_ses-20190925_ophys
  held_out_recordings:
    - sub-20190929-02_ses-20190929_ophys
    - sub-20190929-05_ses-20190929_ophys
    - sub-20190929-07_ses-20190929_ophys
    - sub-20191030-07_ses-20191030_ophys

protocol:
  temporal_strides: [1, 5, 10, 20, 40]
  severe_motion: exact_top_25_percent_label_free_symmetric_chamfer_per_recording_and_stride
  severe_motion_tiebreak: descending_motion_then_earlier_source_frame_index
