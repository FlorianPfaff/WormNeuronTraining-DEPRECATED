  known_provenance_codes: {}
  unresolved_codes_note: Release NEIR must not be equated to current code ZEIR without release-specific evidence; user initials do not independently prove manual annotation.
  manual_subset_source: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1012075
  sparse_validation_route:
    status: conditional_until_release_rows_are_mapped
    paper_verified_scope: Ten neurons were corrected or verified across every frame and then classified as manual annotations; their starting tracks were algorithm-generated.
    missing_release_link: Inspected Zenodo 1.0 description does not map those ten neurons to worldline IDs or provenance codes. Current annotator documentation permits changing provenance strings and is not an exact-release verification log.
    allowed_if_resolved: Expert-verified sparse-neuron temporal validation, with the mapped IDs/frames frozen before scoring; never imply every released trajectory is verified.
    source_url: https://zenodo.org/records/10818810
    retrieved_on: '2026-10-04'
  paper_reported_rate_hz: 4
  paper_rate_is_not_asset_timestamp_verification: true
