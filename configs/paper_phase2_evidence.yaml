  archive_size: 14869755504
  prefix: zephir/ZM9624_Ex(myo-20_mCherry)/
  retrieved_on: '2026-10-03'
  aliases: [ZM9624_Ex(myo-20_mCherry), ZephIR_new_worm]
  excluded_aliases: [nguyen2017_AL_w1, churchland_CSHL049_2020_01_20_001]
